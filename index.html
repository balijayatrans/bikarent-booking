<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sewa Motor - Bikarent</title>
    <!-- Google Fonts Inter & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc; 
            color: #334155;
            padding: 15px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .form-container { 
            width: 100%; 
            max-width: 580px; 
            padding: 24px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            margin: -24px -24px 20px -24px;
            padding: 22px 24px 0px 24px;
            background: #f1c10f;
            width: calc(100% + 48px);
            box-sizing: border-box;
            position: relative;
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 13px;
            color: #334155;
            margin-top: 4px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .header-divider {
            height: 4px;
            width: 100%;
            background: #d39e00;
            margin: 0;
            border-radius: 0;
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        label { 
            display: block; 
            margin-bottom: 6px;
            font-weight: 600; 
            font-size: 12px; 
            color: #475569;
            text-transform: none;
            letter-spacing: 0.1px;
        }
        
        .input-icon-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon-wrapper i.field-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }

        .input-icon-wrapper input, 
        .input-icon-wrapper select, 
        .input-icon-wrapper textarea {
            padding-left: 36px !important;
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px !important;
            font-weight: 400 !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            transition: all 0.2s ease;
            background-color: #f8fafc;
            color: #1e293b !important;
            height: 40px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            line-height: 1.4;
        }

        input::placeholder, 
        select::placeholder, 
        textarea::placeholder {
            color: #94a3b8 !important;
            font-weight: 400 !important;
            font-size: 13px !important;
            opacity: 1;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .grid-address-time textarea {
            height: 40px;
            min-height: 40px;
            padding-top: 9px !important;
            padding-bottom: 9px !important;
            padding-right: 12px;
            overflow: hidden;
        }

        .grid-address-time textarea:focus {
            height: 52px;
            overflow-y: auto;
        }

        .notes-textarea {
            height: 52px !important;
            min-height: 52px !important;
            padding-top: 10px !important;
            padding-bottom: 10px !important;
            padding-right: 12px;
        }

        .grid-user-info {
            display: flex;
            gap: 5px;
            margin-bottom: 2px;
        }
        .grid-user-info > * { flex: 1; }

        .grid-date-duration {
            display: flex;
            gap: 5px;
            margin-bottom: 14px;
        }
        .grid-date-duration > *:nth-child(1) { flex: 1; }
        .grid-date-duration > *:nth-child(2) { width: 140px; flex-shrink: 0; }

        .grid-address-time {
            display: flex;
            gap: 5px;
            margin-bottom: 14px;
        }
        .grid-address-time > *:nth-child(1) { flex: 1; }
        .grid-address-time > *:nth-child(2) { width: 140px; flex-shrink: 0; }

        .motor-row-card {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 10px;
        }

        .motor-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .motor-row .motor-select-col { flex: 1; }
        .motor-row .motor-qty-col { width: 140px; flex-shrink: 0; }
        .motor-row .motor-btn-col { width: 38px; flex-shrink: 0; display: flex; justify-content: center; }

        .motor-row select[name="qty[]"] { 
            text-align: left; 
            font-weight: 400 !important;
            font-size: 13px !important;
            color: #1e293b !important;
            font-family: 'Inter', sans-serif !important;
            padding: 10px 12px !important;
            cursor: pointer;
        }

        @media (min-width: 601px) {
            .grid-date-duration > *:nth-child(2) { width: 140px; }
        }

        @media (max-width: 600px) {
            .grid-user-info { flex-direction: column; gap: 0; }
            .grid-address-time { flex-direction: column; gap: 0; }
            .grid-address-time > *:nth-child(2) { width: 100%; }
            .grid-address-time textarea { height: 52px; min-height: 52px; padding-top: 10px !important; }
            
            .grid-date-duration { display: flex; gap: 5px; }
            .grid-date-duration > *:nth-child(1) { flex: 1; }
            .grid-date-duration > *:nth-child(2) { width: 140px; flex-shrink: 0; }

            .motor-row .motor-qty-col { width: 110px; }
        }

        .btn-action {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .btn-add { background-color: #10b981; }
        .btn-add:hover { background-color: #059669; }
        .btn-remove { background-color: #ef4444; }
        .btn-remove:hover { background-color: #dc2626; }

        .tier-badge {
            display: inline-block;
            padding: 3px 8px;
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .estimation-card {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            margin: 0;
        }

        .estimation-breakdown {
            font-size: 13px;
            color: #334155;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .breakdown-item-sub {
            font-size: 11px;
            color: #64748b;
            margin-top: -4px;
            margin-bottom: 6px;
        }

        .estimation-card .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .estimation-card .value-total {
            font-size: 18px;
            font-weight: 800;
            color: #1d4ed8;
        }

        .bottom-action-grid {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-check-price {
            flex: 1;
            background-color: #0284c7;
            color: white;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .btn-check-price:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }

        .whatsapp-submit-btn {
            flex: 1.2;
            background-color: #16a34a;
            color: white;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        .whatsapp-submit-btn:hover {
            background-color: #15803d;
            transform: translateY(-1px);
        }

        .price-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .price-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .price-modal {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 20px;
            padding: 22px;
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.25);
        }

        .price-modal-overlay.active .price-modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .flatpickr-calendar .flatpickr-day-tooltip {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            z-index: 99;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .validation-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .validation-toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-title">
            <h2><i class="fa-solid fa-motorcycle" style="color: #1e293b;"></i> Form Sewa Motor Bikarent</h2>
            <p>Isi formulir di bawah ini untuk reservasi unit</p>
            <div class="header-divider"></div>
        </div>

        <form id="bookingForm" onsubmit="submitForm(event)">
            
            <input type="hidden" id="nopol" name="nopol" value="">
            <input type="hidden" id="ongkir" name="ongkir" value="0">
            <input type="hidden" id="sub_total" name="sub_total" value="0">
            <input type="hidden" id="deposit" name="deposit" value="0">
            <input type="hidden" id="sisa_pembayaran" name="sisa_pembayaran" value="0">
            <input type="hidden" id="penerima_pembayaran" name="penerima_pembayaran" value="">
            <input type="hidden" id="status_unit" name="status_unit" value="Order">

            <!-- Grid Nama Lengkap & WhatsApp -->
            <div class="grid-user-info">
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" id="nama" name="nama" required placeholder="Sesuai KTP / SIM">
                    </div>
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp *</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-brands fa-whatsapp field-icon"></i>
                        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="08123456789">
                    </div>
                </div>
            </div>

            <!-- Tanggal Sewa & Durasi Grid -->
            <div class="grid-date-duration">
                <div class="form-group">
                    <label>Tanggal Sewa *</label>
                    <div class="input-icon-wrapper date-wrapper">
                        <i class="fa-solid fa-calendar-days field-icon"></i>
                        <input type="text" id="tanggal_sewa" name="tanggal_sewa" required placeholder="Pilih Tanggal Mulai - Selesai">
                    </div>
                </div>
                <div class="form-group">
                    <label>Durasi</label>
                    <input type="text" id="durasi_label" readonly value="2 Hari" style="text-align: center; font-weight: 600 !important; color: #2563eb !important; width: 100%;">
                    <input type="hidden" id="durasi" name="durasi" value="2">
                </div>
            </div>

            <!-- Pemilihan Motor -->
            <div class="form-group">
                <label>Pilih Motor & Jumlah *</label>
                <div id="motorContainer">
                    <!-- Dynamic Rows Populated via JS -->
                </div>
            </div>

            <!-- Penyerahan -->
            <div class="grid-address-time">
                <div class="form-group">
                    <label>Alamat Penyerahan *</label>
                    <div class="input-icon-wrapper textarea-wrapper">
                        <i class="fa-solid fa-location-dot field-icon"></i>
                        <textarea id="alamat_antar" name="alamat_antar" required placeholder="Hotel / Bandara / Alamat"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <label>Jam Penyerahan</label>
                    <div class="input-icon-wrapper select-wrapper">
                        <i class="fa-solid fa-clock field-icon"></i>
                        <select id="waktu_antar" name="waktu_antar" class="time-select" onchange="calculateDuration()"></select>
                    </div>
                </div>
            </div>

            <!-- Pengembalian -->
            <div class="grid-address-time">
                <div class="form-group">
                    <label>Alamat Pengembalian *</label>
                    <div class="input-icon-wrapper textarea-wrapper">
                        <i class="fa-solid fa-location-arrow field-icon"></i>
                        <textarea id="alamat_kembali" name="alamat_kembali" required placeholder="Alamat Pengembalian"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <label>Jam Pengembalian</label>
                    <div class="input-icon-wrapper select-wrapper">
                        <i class="fa-solid fa-clock field-icon"></i>
                        <select id="waktu_kembali" name="waktu_kembali" class="time-select" onchange="calculateDuration()"></select>
                    </div>
                </div>
            </div>

            <!-- Catatan Tambahan -->
            <div class="form-group">
                <label>Catatan Tambahan (Opsional)</label>
                <div class="input-icon-wrapper textarea-wrapper">
                    <i class="fa-solid fa-note-sticky field-icon"></i>
                    <textarea id="pesan_tambahan" name="pesan_tambahan" class="notes-textarea" placeholder="Jumlah helm, jas hujan, dll."></textarea>
                </div>
            </div>

            <!-- Grid 2 Tombol di Bagian Bawah -->
            <div class="bottom-action-grid">
                <button type="button" class="btn-check-price" onclick="openPriceModal()">
                    <i class="fa-solid fa-calculator"></i>
                    <span>Cek Harga</span>
                </button>
                <button type="submit" class="whatsapp-submit-btn">
                    <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
                    <span>Booking Motor</span>
                </button>
            </div>

        </form>
    </div>

    <!-- POP-UP MODAL HARGA -->
    <div class="price-modal-overlay" id="priceModalOverlay" onclick="closePriceModalOnOutside(event)">
        <div class="price-modal">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-receipt" style="color: #2563eb;"></i>
                    <span>Rincian Estimasi Biaya</span>
                </div>
                <button type="button" class="modal-close-btn" onclick="closePriceModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="estimation-card">
                <div id="tierBadgeContainer">
                    <span class="tier-badge" id="modalTierBadge">Paket Harian (1-5 Hari)</span>
                </div>
                <div class="estimation-breakdown" id="modalBreakdownContainer">
                    <div style="color: #94a3b8; font-style: italic;">Pilih unit motor untuk melihat rincian...</div>
                </div>
                <div class="total-row">
                    <div style="font-size: 14px; font-weight: 700; color: #1e40af;">Total Estimasi</div>
                    <div class="value-total" id="modalGrandTotalDisplay">Rp 0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="validation-toast">Mohon lengkapi pilihan motor terlebih dahulu!</div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec"; 
        const ADMIN_WA = "6281999009090";

        // Pre-initialize fallback price list immediately so lookups never return undefined
        let priceListData = [
            { nama: "Honda Beat", p1_5: 70000, p6_10: 60000, p11_14: 50000, p30: 45000 },
            { nama: "Honda Scoopy FI", p1_5: 60000, p6_10: 50000, p11_14: 45000, p30: 35000 },
            { nama: "Honda Scoopy NEW", p1_5: 80000, p6_10: 75000, p11_14: 65000, p30: 50000 },
            { nama: "Yamaha Fazzio", p1_5: 85000, p6_10: 80000, p11_14: 70000, p30: 60000 },
            { nama: "Yamaha Lexi", p1_5: 110000, p6_10: 100000, p11_14: 90000, p30: 80000 },
            { nama: "Honda Vario 110", p1_5: 60000, p6_10: 50000, p11_14: 45000, p30: 35000 },
            { nama: "Honda Vario 125", p1_5: 90000, p6_10: 85000, p11_14: 80000, p30: 65000 },
            { nama: "Honda Vario 160", p1_5: 100000, p6_10: 90000, p11_14: 85000, p30: 70000 },
            { nama: "Honda PCX", p1_5: 150000, p6_10: 120000, p11_14: 100000, p30: 90000 },
            { nama: "Yamaha N Max", p1_5: 150000, p6_10: 120000, p11_14: 100000, p30: 90000 },
            { nama: "Yamaha N Max (Turbo)", p1_5: 170000, p6_10: 140000, p11_14: 120000, p30: 100000 }
        ];

        let durasiHari = 2;
        let selectedStartDate = new Date();
        let selectedEndDate = new Date();
        let flatpickrInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            populateTimeOptions();
            initFlatpickr();
            fetchPriceList();
            setupAutoFocusFlow();

            document.getElementById('alamat_antar').addEventListener('input', function() {
                document.getElementById('alamat_kembali').value = this.value;
            });

            document.getElementById('waktu_antar').addEventListener('change', function() {
                document.getElementById('waktu_kembali').value = this.value;
                calculateDuration();
            });
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Auto focus sequence flow
        function setupAutoFocusFlow() {
            const namaInput = document.getElementById('nama');
            const waInput = document.getElementById('whatsapp');
            const alamatAntarInput = document.getElementById('alamat_antar');
            const jamAntarSelect = document.getElementById('waktu_antar');
            const alamatKembaliInput = document.getElementById('alamat_kembali');

            namaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (namaInput.value.trim() !== '') waInput.focus();
                }
            });

            waInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (waInput.value.trim() !== '' && flatpickrInstance) {
                        flatpickrInstance.open();
                    }
                }
            });

            alamatAntarInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (alamatAntarInput.value.trim() !== '') jamAntarSelect.focus();
                }
            });

            alamatKembaliInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (alamatKembaliInput.value.trim() !== '') document.getElementById('pesan_tambahan').focus();
                }
            });
        }

        function populateTimeOptions() {
            const selects = document.querySelectorAll('.time-select');
            let optionsHTML = '';

            for (let hour = 8; hour <= 22; hour++) {
                const hourStr = hour < 10 ? '0' + hour : '' + hour;
                optionsHTML += `<option value="${hourStr}:00">${hourStr}:00 WITA</option>`;
                if (hour < 22) {
                    optionsHTML += `<option value="${hourStr}:30">${hourStr}:30 WITA</option>`;
                }
            }

            selects.forEach(select => {
                select.innerHTML = optionsHTML;
                select.value = "09:00";
            });
        }

        function initFlatpickr() {
            const startDate = new Date();
            const endDate = new Date();
            endDate.setDate(startDate.getDate() + 2);

            selectedStartDate = startDate;
            selectedEndDate = endDate;

            flatpickrInstance = flatpickr("#tanggal_sewa", {
                mode: "range",
                dateFormat: "d M Y",
                minDate: "today",
                defaultDate: [startDate, endDate],
                locale: "id",
                onChange: function(selectedDates) {
                    if (selectedDates.length === 2) {
                        selectedStartDate = selectedDates[0];
                        selectedEndDate = selectedDates[1];
                    }
                    calculateDuration();
                },
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    dayElem.addEventListener('mouseenter', function() {
                        if (fp.selectedDates.length === 1 && !dayElem.classList.contains('disabled')) {
                            const hoverDate = dayElem.dateObj;
                            const firstDate = fp.selectedDates[0];
                            if (hoverDate >= firstDate) {
                                const diffTime = Math.abs(hoverDate.getTime() - firstDate.getTime());
                                const days = Math.round(diffTime / (1000 * 60 * 60 * 24));
                                const actualDays = days < 2 ? 2 : days;
                                
                                let tooltip = dayElem.querySelector('.flatpickr-day-tooltip');
                                if (!tooltip) {
                                    tooltip = document.createElement('span');
                                    tooltip.className = 'flatpickr-day-tooltip';
                                    dayElem.appendChild(tooltip);
                                }
                                tooltip.textContent = `${actualDays} Hari`;
                            }
                        }
                    });

                    dayElem.addEventListener('mouseleave', function() {
                        const tooltip = dayElem.querySelector('.flatpickr-day-tooltip');
                        if (tooltip) tooltip.remove();
                    });
                },
                onClose: function(selectedDates) {
                    if (selectedDates.length === 2) {
                        setTimeout(() => {
                            const firstMotorSelect = document.querySelector('.motor-select');
                            if (firstMotorSelect) firstMotorSelect.focus();
                        }, 100);
                    }
                }
            });
            calculateDuration();
        }

        // Exact duration calculation rules with 2-hour grace period & 2-day minimum
        function calculateDuration() {
            if (!selectedStartDate || !selectedEndDate) return;

            const timeDiff = selectedEndDate.getTime() - selectedStartDate.getTime();
            let baseDays = Math.round(timeDiff / (1000 * 60 * 60 * 24));
            if (baseDays < 1) baseDays = 1;

            const jamAntarVal = document.getElementById('waktu_antar').value || "09:00";
            const jamKembaliVal = document.getElementById('waktu_kembali').value || "09:00";

            const [h1, m1] = jamAntarVal.split(':').map(Number);
            const [h2, m2] = jamKembaliVal.split(':').map(Number);

            const totalMinsAntar = h1 * 60 + m1;
            const totalMinsKembali = h2 * 60 + m2;
            const diffMinutes = totalMinsKembali - totalMinsAntar;

            let totalDays = baseDays;
            if (diffMinutes > 120) {
                totalDays += 1;
            }

            if (totalDays < 2) {
                totalDays = 2;
            }

            durasiHari = totalDays;
            document.getElementById('durasi_label').value = `${durasiHari} Hari`;
            document.getElementById('durasi').value = durasiHari;

            calculateTotal();
        }

        function fetchPriceList() {
            fetch(`${SCRIPT_URL}?action=getList`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success' && res.data && res.data.length > 0) {
                        priceListData = res.data;
                    }
                    renderInitialMotorRow();
                })
                .catch(err => {
                    renderInitialMotorRow();
                });
        }

        function renderInitialMotorRow() {
            const container = document.getElementById('motorContainer');
            container.innerHTML = '';
            addMotorRow(true);
        }

        function getOptionsHTML() {
            let options = `<option value="">-- Pilih Motor --</option>`;
            priceListData.forEach((item, index) => {
                options += `<option value="${item.nama}" data-index="${index}">${item.nama}</option>`;
            });
            return options;
        }

        function addMotorRow(isFirst = false) {
            if (!isFirst) {
                const motorSelects = document.querySelectorAll('.motor-select');
                const lastSelect = motorSelects[motorSelects.length - 1];
                if (!lastSelect || lastSelect.value === "") {
                    showToast("Pilih tipe motor terlebih dahulu sebelum menambah unit baru!");
                    lastSelect.focus();
                    return;
                }
            }

            const container = document.getElementById('motorContainer');
            const card = document.createElement('div');
            card.className = 'motor-row-card';
            
            const btnHTML = isFirst 
                ? `<button type="button" class="btn-action btn-add" onclick="addMotorRow(false)"><i class="fa-solid fa-plus"></i></button>`
                : `<button type="button" class="btn-action btn-remove" onclick="removeMotorRow(this)"><i class="fa-solid fa-trash"></i></button>`;

            card.innerHTML = `
                <div class="motor-row">
                    <div class="motor-select-col">
                        <div class="input-icon-wrapper select-wrapper">
                            <i class="fa-solid fa-motorcycle field-icon"></i>
                            <select name="jenis_motor[]" class="motor-select" onchange="onMotorSelected(this)" required>
                                ${getOptionsHTML()}
                            </select>
                        </div>
                    </div>
                    <div class="motor-qty-col">
                        <select name="qty[]" class="motor-qty" onchange="calculateTotal()">
                            <option value="1">1 Unit</option>
                            <option value="2">2 Unit</option>
                            <option value="3">3 Unit</option>
                            <option value="4">4 Unit</option>
                            <option value="5">5 Unit</option>
                        </select>
                    </div>
                    <div class="motor-btn-col">
                        ${btnHTML}
                    </div>
                </div>
            `;
            container.appendChild(card);
            calculateTotal();
        }

        function onMotorSelected(selectElem) {
            calculateTotal();
            if (selectElem.value !== '') {
                document.getElementById('alamat_antar').focus();
            }
        }

        function removeMotorRow(btn) {
            btn.closest('.motor-row-card').remove();
            calculateTotal();
        }

        function getDailyRate(item, days) {
            if (!item) return 0;
            if (days >= 30) return item.p30 || item.p11_14 || item.p6_10 || item.p1_5;
            if (days >= 11) return item.p11_14 || item.p6_10 || item.p1_5;
            if (days >= 6) return item.p6_10 || item.p1_5;
            return item.p1_5;
        }

        function getTierName(days) {
            if (days >= 30) return "Paket Bulanan (≥ 30 Hari)";
            if (days >= 11) return "Paket Hemat (11-14 Hari)";
            if (days >= 6) return "Paket Mingguan (6-10 Hari)";
            return "Paket Harian (1-5 Hari)";
        }

        function calculateTotal() {
            let grandTotal = 0;
            const cards = document.querySelectorAll('.motor-row-card');
            const modalBreakdownContainer = document.getElementById('modalBreakdownContainer');
            const modalTierBadge = document.getElementById('modalTierBadge');
            
            modalTierBadge.textContent = getTierName(durasiHari);
            modalBreakdownContainer.innerHTML = '';

            let hasValidItem = false;

            cards.forEach(card => {
                const select = card.querySelector('.motor-select');
                const qtyInput = card.querySelector('.motor-qty');

                const selectedOption = select.options[select.selectedIndex];
                const itemIndex = selectedOption ? selectedOption.getAttribute('data-index') : null;
                const itemData = (itemIndex !== null && priceListData[itemIndex]) ? priceListData[itemIndex] : null;

                if (itemData) {
                    hasValidItem = true;
                    const dailyRate = getDailyRate(itemData, durasiHari);
                    const qty = parseInt(qtyInput.value) || 1;
                    const rowSubtotal = dailyRate * qty * durasiHari;

                    const itemRow = document.createElement('div');
                    itemRow.className = 'breakdown-item';
                    itemRow.innerHTML = `
                        <span>• ${qty} Unit ${itemData.nama} × ${durasiHari} Hari</span>
                        <span style="font-weight: 600;">Rp ${rowSubtotal.toLocaleString('id-ID')}</span>
                    `;
                    
                    const subDetailRow = document.createElement('div');
                    subDetailRow.className = 'breakdown-item-sub';
                    subDetailRow.innerHTML = `Tarif paket: Rp ${dailyRate.toLocaleString('id-ID')}/hari/unit`;

                    modalBreakdownContainer.appendChild(itemRow);
                    modalBreakdownContainer.appendChild(subDetailRow);
                    grandTotal += rowSubtotal;
                }
            });

            if (!hasValidItem) {
                const emptyMsg = `<div style="color: #94a3b8; font-style: italic;">Pilih unit motor untuk melihat rincian...</div>`;
                modalBreakdownContainer.innerHTML = emptyMsg;
            }

            const formattedGrandTotal = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            document.getElementById('modalGrandTotalDisplay').textContent = formattedGrandTotal;
            document.getElementById('sub_total').value = grandTotal;
        }

        function openPriceModal() {
            document.getElementById('priceModalOverlay').classList.add('active');
        }

        function closePriceModal() {
            document.getElementById('priceModalOverlay').classList.remove('active');
        }

        function closePriceModalOnOutside(event) {
            if (event.target.id === 'priceModalOverlay') {
                closePriceModal();
            }
        }

        function submitForm(event) {
            event.preventDefault();

            const randomCode = 'BKR-' + Math.random().toString(36).substring(2, 5).toUpperCase();

            let listMotorStr = "";
            const cards = document.querySelectorAll('.motor-row-card');
            cards.forEach(card => {
                const select = card.querySelector('.motor-select');
                const qty = card.querySelector('.motor-qty').value;
                if(select.value) {
                    listMotorStr += `- ${select.value} (${qty})\n`;
                }
            });

            const nama = document.getElementById('nama').value;
            const wa = document.getElementById('whatsapp').value;
            const tglSewa = document.getElementById('tanggal_sewa').value;
            const durasiNum = document.getElementById('durasi').value;
            const durasiStr = `${durasiNum} Hari`;
            const alamatAntar = document.getElementById('alamat_antar').value;
            const jamAntar = document.getElementById('waktu_antar').value;
            const alamatKembali = document.getElementById('alamat_kembali').value;
            const jamKembali = document.getElementById('waktu_kembali').value;
            const pesan = document.getElementById('pesan_tambahan').value || '-';
            const totalBayar = document.getElementById('modalGrandTotalDisplay').textContent;
            const tierName = getTierName(durasiHari);

            const waText = 
`*RESERVASI SEWA MOTOR - BIKARENT*
----------------------------------------
*Kode Booking:* ${randomCode}
*Nama:* ${nama}
*WhatsApp:* ${wa}

*Unit Motor:*
${listMotorStr}
*Paket:* ${tierName}
*Tanggal:* ${tglSewa} (${durasiStr})
*Penyerahan:* ${alamatAntar} (${jamAntar} WITA)
*Pengembalian:* ${alamatKembali} (${jamKembali} WITA)
*Catatan:* ${pesan}

*Estimasi Total:* ${totalBayar}
----------------------------------------
Halo Admin Bikarent, mohon konfirmasi untuk pesanan saya di atas. Terima kasih!`;

            const payload = {
                bookingCode: randomCode,
                nama: nama,
                whatsapp: wa,
                tanggalMulai: selectedStartDate.toISOString(),
                tanggalSelesai: selectedEndDate.toISOString(),
                durasi: durasiNum,
                jenisMotor: listMotorStr.replace(/\n/g, ', '),
                alamatAntar: alamatAntar,
                waktuAntar: jamAntar,
                alamatKembali: alamatKembali,
                waktuKembali: jamKembali,
                pesan: pesan,
                subTotal: document.getElementById('sub_total').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(e => console.log('Saved to Google Sheets'));

            const waUrl = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(waText)}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
